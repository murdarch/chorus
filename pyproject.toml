[project]
name = "chorus"
version = "0.1.0"
description = "Multi-LLM Teams chat bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "botbuilder-core>=4.14.0",
    "aiohttp>=3.9.0",
    "discord.py>=2.3.0",
    "openai>=1.0.0",
    "sqlite-vss>=0.1.2",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
